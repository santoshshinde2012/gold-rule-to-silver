[project]
name = "gold-rule-to-silver"
version = "1.0.0"
description = "Move a cleanup rule copied into several Gold reports into one shared Silver rule, on a local Delta table."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Santosh Shinde" }]
dependencies = ["deltalake==1.6.6", "pyarrow>=17", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
ignore_missing_imports = true
