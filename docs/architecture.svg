<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="title description">
  <title id="title">Gold Rule to Silver architecture</title>
  <desc id="description">Synthetic changes are persisted in a local Delta table. One pinned version feeds both the legacy Gold rules and a shared Silver current state. The new Gold reports consume that shared state. A per-order comparison explains the changed answers. Only the change history is persisted. </desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#0f766e"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .heading { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #475569; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .box-title { font-size: 22px; font-weight: 700; }
      .body { font-size: 19px; fill: #334155; }
      .small { font-size: 17px; fill: #475569; }
      .note { font-size: 18px; fill: #92400e; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .shared-flow { fill: none; stroke: #0f766e; stroke-width: 2.5; marker-end: url(#teal-arrow); }
    </style>
  </defs>
  <rect width="1360" height="620" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="1358" height="618" rx="17" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <text x="40" y="56" class="heading">One shared Silver rule. Report-specific filters stay in Gold.</text>
  <text x="40" y="89" class="subtitle">Compare the same source version to separate a rule change from newly arriving data.</text>

  <text x="40" y="142" class="label">SOURCE</text>
  <text x="250" y="142" class="label">PERSISTED HISTORY</text>
  <text x="540" y="142" class="label">RULES AND REPORTS · IN MEMORY</text>
  <text x="1130" y="142" class="label">VALIDATION</text>

  <rect x="40" y="280" width="160" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="319" class="box-title">Synthetic</text>
  <text x="60" y="348" class="box-title" style="font-size: 20px">order changes</text>
  <text x="60" y="379" class="small">JSON seed</text>

  <rect x="250" y="260" width="240" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="270" y="297" class="box-title">Local Delta table</text>
  <text x="270" y="330" class="body">silver_order_changes</text>
  <text x="270" y="362" class="body">Every source change</text>
  <text x="270" y="395" class="small">Pin a table version</text>

  <rect x="540" y="170" width="260" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="560" y="206" class="box-title">Legacy Gold reports</text>
  <text x="560" y="239" class="body">Sales: latest arrival</text>
  <text x="560" y="269" class="body">Operations: highest seq</text>
  <text x="560" y="294" class="small">Ties: first row seen</text>

  <rect x="540" y="350" width="260" height="190" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="560" y="386" class="box-title">Shared Silver state</text>
  <text x="560" y="418" class="body">Deduplicate deliveries</text>
  <text x="560" y="448" class="body">Highest source_seq wins</text>
  <text x="560" y="478" class="body">Apply source deletes</text>
  <rect x="555" y="493" width="230" height="33" rx="7" fill="#fef3c7"/>
  <text x="568" y="516" class="note">Conflicting ties → review</text>

  <rect x="850" y="350" width="230" height="190" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="870" y="386" class="box-title">New Gold reports</text>
  <text x="870" y="422" class="body">Sales</text>
  <text x="870" y="448" class="small">Accepted orders only</text>
  <text x="870" y="485" class="body">Operations</text>
  <text x="870" y="511" class="small">Includes cancellations</text>

  <rect x="1130" y="230" width="190" height="230" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1150" y="267" class="box-title">Per-order</text>
  <text x="1150" y="295" class="box-title">comparison</text>
  <text x="1150" y="333" class="body">Before → after</text>
  <text x="1150" y="363" class="body">Same version</text>
  <text x="1150" y="393" class="body">Reason for each</text>
  <text x="1150" y="419" class="body">changed answer</text>
  <text x="1150" y="446" class="small">Sales: 275 → 170</text>

  <path d="M200 340H241" class="flow"/>
  <path d="M490 310H515V240H531" class="flow"/>
  <path d="M490 370H515V445H531" class="shared-flow"/>
  <path d="M800 240H1099V275H1121" class="flow"/>
  <path d="M800 445H841" class="shared-flow"/>
  <path d="M1080 445H1105V405H1121" class="shared-flow"/>
  <text x="850" y="221" class="small">Answers from copied rules</text>
  <text x="540" y="574" class="small">Only history is persisted; current state and Gold answers are computed with pandas.</text>

</svg>
